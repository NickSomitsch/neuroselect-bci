splits:
  train:
    count_per_profile: 1000
    templates:
      - template_id: train-direct-request
        topic: daily_request
        segments:
          - "{request_prefix} {action}"
          - "{object}"
          - "{request_suffix}"
      - template_id: train-location-request
        topic: object_location
        segments:
          - "{request_prefix} {action}"
          - "{object}"
          - "to {location}"
          - "{request_suffix}"
      - template_id: train-routine-statement
        topic: stable_routine
        segments:
          - "{routine_prefix} {activity}"
          - "at {time_reference}"
          - "{statement_suffix}"
      - template_id: train-status-update
        topic: status_statement
        segments:
          - "{status_prefix} {state}"
          - "near {location}"
          - "{statement_suffix}"

  validation:
    count_per_profile: 150
    templates:
      - template_id: validation-time-first
        topic: scheduled_request
        segments:
          - "{time_lead}"
          - "{time_reference}"
          - "{request_prefix} {action}"
          - "{object}"
          - "{request_suffix}"
      - template_id: validation-location-first
        topic: location_update
        segments:
          - "At {location}"
          - "{status_prefix} {state}"
          - "{statement_suffix}"

  test:
    count_per_profile: 250
    templates:
      - template_id: test-soft-request
        topic: indirect_request
        segments:
          - "{soft_request_prefix} {action}"
          - "{object}"
          - "before {time_reference}"
          - "{request_suffix}"
      - template_id: test-preference-choice
        topic: preference_choice
        segments:
          - "{preference_prefix}"
          - "{option}"
          - "{preference_suffix}"
      - template_id: test-clarification
        topic: clarification
        segments:
          - "{clarify_prefix}"
          - "{object}"
          - "or {option}"
          - "{question_suffix}"
