    - my notebook
    - the phone charger
    - the blue folder
    - my headphones
    - the coffee mug
    - the house keys
    - the desk lamp
    - the shopping list
    - the soft blanket
    - the window shade
    - the tablet stand
    - the wall calendar
    - today's mail
    - the lunch bag
    - the remote control
  location:
    - the kitchen
    - the front desk
    - the living room
    - the quiet room
    - the side table
    - the top drawer
    - the hallway shelf
    - the office
    - the reading corner
    - the entryway
  time_reference:
    - eight o'clock
    - nine thirty
    - late morning
    - before lunch
    - early afternoon
    - three o'clock
    - after the break
    - before dinner
    - this evening
    - tomorrow morning
  activity:
    - read quietly
    - check messages
    - plan tomorrow
    - review notes
    - make tea
    - call home
    - write briefly
    - tidy up
    - listen closely
    - rest indoors
    - organize papers
    - prepare lunch
  state:
    - ready
    - comfortable
    - tired
    - focused
    - finished
    - waiting
    - uncertain
    - available
    - busy
