[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neuroselect-bci"
version = "0.1.0.dev0"
description = "Personalized, uncertainty-aware language prediction for non-invasive BCI communication"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Nick Somitsch" }]
dependencies = [
  "fastapi>=0.115,<1",
  "mne>=1.9,<2",
  "numpy>=2,<3",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "httpx2>=2.7,<3",
  "mypy>=1.15,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6.1,<7",
  "ruff>=0.12,<0.13",
  "types-pyyaml>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neuroselect"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=neuroselect --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["neuroselect"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["neuroselect"]

[[tool.mypy.overrides]]
module = ["mne", "mne.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
