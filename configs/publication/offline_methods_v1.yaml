research_questions:
  - question_id: RQ1
    question: How often does target-blind candidate generation make intended synthetic spans available?
    evidence_source_ids: [held-out-language]
    primary_estimands:
      - target availability overall and by profile, span position, and phrase length
      - complete-message target availability
  - question_id: RQ2
    question: Conditional on target availability, how does adapter personalization change language ranking?
    evidence_source_ids: [held-out-language]
    primary_estimands:
      - paired personalized-minus-generic mean reciprocal rank
      - paired conditional and unconditional top-1 and top-3 recall
  - question_id: RQ3
    question: How well does the locked xDAWN-LDA decoder perform on held-out original-task Study P data?
    evidence_source_ids: [xdawn-original-task]
    primary_estimands:
      - per-subject and aggregate AUROC, Brier score, and calibration error
      - selection-level target-event ranking metrics
  - question_id: RQ4
    question: Does complete fusion improve offline counterfactual ranking or completion over prespecified component conditions?
    evidence_source_ids: [counterfactual-research]
    primary_estimands:
      - complete-system minus BCI-only top-1 recall and completion rate
      - personalization, retrieval, and safety-policy paired contrasts
  - question_id: RQ5
    question: Which observed limitations arise from candidate coverage, ranking, neural decoding, retrieval, or safety policy?
    evidence_source_ids:
      - controlled-simulation
      - held-out-language
      - xdawn-original-task
      - counterfactual-research
    primary_estimands:
      - evidence-tier-separated bottleneck decomposition

claim_policy:
  allowed:
    - NeuroSelect is a reproducible offline framework with checksum-addressed evidence tiers.
    - Results describe synthetic language, original-task public EEG, and counterfactual replay separately.
    - Candidate availability is an observed bottleneck in the frozen synthetic-language evaluation.
    - Personalization changed conditional ranking on average with heterogeneous profile-level effects.
    - The frozen replay did not demonstrate a meaningful complete-system advantage over BCI-only decoding.
  prohibited:
    - NeuroSelect decodes unrestricted thoughts or user intent.
    - NeuroSelect improves communication for people in live use.
    - NeuroSelect has demonstrated clinical efficacy, safety, or medical-device performance.
    - Synthetic or counterfactual messages are participant-authored communication.
    - Claim eligibility means that an effect is positive, conclusive, or population-generalizable.

