excluded_artifact_classes:
  - artifact_class: raw-or-processed-study-p-eeg
    reason: Study P is accessed from its original public source under its own terms and is not redistributed.
  - artifact_class: qwen-model-weights-and-caches
    reason: Base-model files retain upstream terms and are reproducibly downloaded from the pinned source.
  - artifact_class: lora-adapters
    reason: Trained adapter payloads are excluded; evaluation summaries and provenance remain available.
  - artifact_class: executable-model-checkpoints
    reason: Joblib, PyTorch, safetensors, and intermediate checkpoint payloads are not archival research outputs.
  - artifact_class: temporary-cloud-and-log-files
    reason: Cloud bundles, caches, terminal logs, and temporary checkpoints are operational rather than evidence.
  - artifact_class: credentials-and-private-correspondence
    reason: Secrets, personal contact data, gate correspondence, and reviewer correspondence must never enter a release.
